<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0A1520;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:380px;background:#112030;border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:32px 28px}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo svg{width:38px;height:38px}
h1{font-size:17px;font-weight:700}
.sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px}
label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.85);margin-bottom:6px}
input[type=password]{width:100%;background:#0A1520;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:11px 14px;font-size:14px;color:#fff;outline:none}
input[type=password]:focus{border-color:#00C8E8}
.rem{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:400;color:rgba(255,255,255,.7);margin:12px 0 18px}
button{width:100%;background:#00C8E8;color:#000;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:#F87171;font-size:12px;min-height:18px;margin-top:10px}
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function show(key) {
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, key, b64(DATA));
  const html = new TextDecoder().decode(plain);
  if (document.readyState !== 'complete') await new Promise(r => window.addEventListener('load', r, { once: true }));
  await new Promise(r => setTimeout(r, 0));
  document.open(); document.write(html); document.close();
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (!saved) return;
  const gate = document.getElementById('gate'); gate.style.visibility = 'hidden';
  try {
    const key = await crypto.subtle.importKey('raw', b64(saved), { name: 'AES-GCM' }, true, ['decrypt']);
    await show(key);
  } catch (e) { gate.style.visibility = ''; try { localStorage.removeItem(STORE); } catch (e2) {} }
})();
document.getElementById('gate').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const key = await derive(document.getElementById('pw').value);
    const raw = await crypto.subtle.exportKey('raw', key);
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, key, b64(DATA));
    if (document.getElementById('rem').checked) { try { localStorage.setItem(STORE, tob64(raw)); } catch (e) {} }
    await show(key);
  } catch (e) {
    err.textContent = 'Wrong password. Please try again.';
    btn.disabled = false;
  }
});
